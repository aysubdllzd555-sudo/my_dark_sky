<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Dark Sky</title>


  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">


  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>


  <header class="bg-white shadow-sm sticky top-0 z-10">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center gap-2">
      <h1 class="font-black text-lg whitespace-nowrap">My Dark Sky</h1>

      <form id="searchForm" class="flex-1">
        <input id="searchInput" type="text" placeholder="Search a city, then press Enter"
          class="w-full rounded-full border border-slate-300 px-4 py-2 text-center focus:outline-none focus:ring-2 focus:ring-sky-400">
      </form>

      <button id="locateBtn" title="Use my location"
        class="w-10 h-10 rounded-full border border-slate-300 hover:bg-sky-50">📍</button>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 pb-16">


    <p id="message" class="hidden mt-6 rounded-lg px-4 py-3"></p>


    <section id="today" class="hidden text-center py-8">
      <p id="placeName" class="text-slate-500 text-sm"></p>
      <div class="flex justify-center items-center gap-4 mt-2">
        <span id="todayIcon" class="text-6xl"></span>
        <span id="todayTemp" class="text-6xl font-light"></span>
      </div>
      <p id="todaySummary" class="text-xl font-bold mt-2"></p>
      <p id="todayRange" class="text-slate-600 text-sm mt-1"></p>
      <p id="cacheInfo" class="inline-block mt-3 text-xs bg-slate-200 text-slate-600 rounded-full px-3 py-1"></p>

      <div id="details" class="grid grid-cols-2 sm:grid-cols-3 gap-3 mt-6 text-left"></div>
    </section>


    <section id="hourlySection" class="hidden">
      <h2 class="font-bold mb-2">Next 24 hours</h2>
      <div id="hourly" class="flex gap-2 overflow-x-auto pb-2"></div>
    </section>


    <section id="dailySection" class="hidden mt-8">
      <h2 class="font-bold mb-2">8-day forecast</h2>
      <div id="daily" class="bg-white rounded-2xl shadow-sm"></div>
    </section>


    <section id="timeSection" class="hidden mt-10 bg-white rounded-2xl shadow-sm p-6 text-center">
      <h2 class="font-bold text-lg">Time Machine</h2>
      <p class="text-slate-500 text-sm mb-4">Pick a date: up to 1 year back or 14 days ahead.</p>
      <input id="dateInput" type="date" class="border border-slate-300 rounded-lg px-3 py-2">
      <button id="dateBtn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg px-5 py-2 ml-2">Show weather</button>
      <div id="dateResult" class="mt-5"></div>
    </section>

  </main>


  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
